# gateway QEMU 仿真叠加：在 gateway_prj.conf 之后合并，关闭无 QEMU 硬件支撑的选项
CONFIG_NETWORKING=n
CONFIG_NET_SHELL=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_DHCPV4=n
CONFIG_MQTT_LIB=n
CONFIG_UART_PIPE=n
CONFIG_CAN=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_NVS=n
CONFIG_ENTROPY_GENERATOR=n
# QEMU 不上云，关闭 mbedtls 省 footprint 并避免 entropy 依赖（云模块已禁用，HMAC 路径不编译）
CONFIG_MBEDTLS=n
CONFIG_MBEDTLS_BUILTIN=n
CONFIG_GATEWAY_MQTT_ENABLE=n
CONFIG_GATEWAY_CLOUD_UPLOAD_ENABLE=n
CONFIG_GATEWAY_OFFLINE_CACHE_ENABLE=n
CONFIG_GATEWAY_MODBUS_ENABLE=n
CONFIG_GATEWAY_CAN_ENABLE=n
