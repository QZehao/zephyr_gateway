# 业务侧 prj 增量：与 framework/prj.conf 一起传给 west/cmake（见 README）
CONFIG_ZEPHYR_GATEWAY_BUSINESS=y

# =============================================================================
# 关闭框架中的所有示例模块
# =============================================================================
CONFIG_EXAMPLE_MODULE_A_ENABLE=n
CONFIG_EXAMPLE_MODULE_B_ENABLE=n
CONFIG_THREAD_IPC_SERVICE_EXAMPLE=n

# =============================================================================
# 网络栈配置（MQTT 上云）
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=4

# DHCP
CONFIG_NET_DHCPV4=y

# 网络接口
CONFIG_NET_L2_ETHERNET=y

# DNS
CONFIG_NET_SHELL=y

# =============================================================================
# MQTT 配置
# =============================================================================
CONFIG_MQTT_LIB=y

# =============================================================================
# CAN 配置
# =============================================================================
CONFIG_CAN=y

# =============================================================================
# Flash / NVS 配置（离线缓存）
# =============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# =============================================================================
# 随机数 / Entropy（网络栈依赖）
# =============================================================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# =============================================================================
# 工业网关模块使能
# =============================================================================
CONFIG_GATEWAY_CAN_ENABLE=n
CONFIG_GATEWAY_MODBUS_ENABLE=y
CONFIG_GATEWAY_MQTT_ENABLE=y
CONFIG_GATEWAY_ANOMALY_ENABLE=y
CONFIG_GATEWAY_CLOUD_UPLOAD_ENABLE=y
CONFIG_GATEWAY_OFFLINE_CACHE_ENABLE=y
CONFIG_GATEWAY_WEBSHELL_ENABLE=y
