# 业务侧 prj 增量：与 framework/prj.conf 一起传给 west/cmake（见 README）
CONFIG_ZEPHYR_GATEWAY_BUSINESS=y

# =============================================================================
# data_bus 通道并发块上限提升：gateway 同时使用 sensor / can_raw / modbus_raw
# 三通道并发发布，峰值 ≈ 3 × queue_depth(16) + 在途缓冲；从 framework 默认 32 上调到 48
#
# 与之配套：256B 数据 slab 容量从默认 8 上调到 24。三个 payload 结构体
# （gateway_sensor_data_t / gateway_can_frame_t / gateway_modbus_data_t）
# 均归入 256B 桶；并发突发（如 Modbus 单轮 N 寄存器 + CAN 帧 + sim 多通道）
# 易耗尽默认 8 个，回退 k_malloc 仍能保证不丢，但损失 bounded-allocation 保证。
# =============================================================================
CONFIG_DATA_BUS=y
CONFIG_DATA_BUS_MAX_BLOCKS=48
CONFIG_DATA_BUS_SLAB_256_COUNT=24

# =============================================================================
# 关闭框架中的所有示例模块
# =============================================================================
CONFIG_EXAMPLE_MODULE_A_ENABLE=n
CONFIG_EXAMPLE_MODULE_B_ENABLE=n
CONFIG_THREAD_IPC_SERVICE_EXAMPLE=n

# =============================================================================
# 网络栈配置（MQTT 上云）
# =============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=4

# DHCP
CONFIG_NET_DHCPV4=y

# 网络接口
CONFIG_NET_L2_ETHERNET=y

# DNS
CONFIG_NET_SHELL=y

# =============================================================================
# MQTT 配置
# =============================================================================
CONFIG_MQTT_LIB=y
# TLS 相关项默认关闭（减少默认 footprint，与 QEMU overlay 兼容）
# 如需启用 AWS TLS 双向认证，取消注释以下配置并在 prj_<board>.conf 中覆盖：
# CONFIG_MQTT_LIB_TLS=y
# CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# CONFIG_MBEDTLS=y
# CONFIG_GATEWAY_AWS_TLS=y
# CONFIG_GATEWAY_AWS_TLS_SEC_TAG=100

# =============================================================================
# CAN 配置
# =============================================================================
CONFIG_CAN=y

# =============================================================================
# Flash / NVS 配置（离线缓存）
# =============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# =============================================================================
# mbedtls / HMAC（云 provider HMAC-SHA1/SHA256 签名路径）
# =============================================================================
# 启用 mbedtls 以支持阿里云/腾讯云 HMAC 签名（cloud_crypto.c 路径）。
# mbedtls 本身不显著影响 footprint（仅用到 HMAC/MD 子集），默认开启。
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_MD_C=y

# =============================================================================
# 随机数 / Entropy（网络栈依赖）
# =============================================================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# =============================================================================
# 浮点 printf 支持（gateway_events.c 的 gateway_sensor_to_json()/
# gateway_anomaly_to_json() 用 snprintf("%.2f"/"%.1f", ...) 序列化传感器/异常
# JSON）
#
# 依据：本仓库两个可能的构建目标（esp32c6_devkitm、qemu_riscv32，见
# build_esp32c6/zephyr/.config、build_tests_conn_qemu/zephyr/.config）均选中
# CONFIG_PICOLIBC=y，其 snprintf 浮点支持由 lib/libc/picolibc/Kconfig 的
# PICOLIBC_IO_LEVEL choice 中 CONFIG_PICOLIBC_IO_FLOAT 控制，与仅影响
# printk/日志格式化的 CONFIG_CBPRINTF_FP_SUPPORT 是两条独立路径，本项目走的
# 是前者（标准 snprintf，非 LOG_*/printk）。
#
# 此前仓库未显式启用该项：esp32c6 因 CONFIG_NET_SHELL=y 经 Zephyr
# subsys/net/lib/shell/Kconfig 的 `select REQUIRES_FLOAT_PRINTF` 间接强制选中
# PICOLIBC_IO_FLOAT（REQUIRES_FLOAT_PRINTF 排除了 choice 中其余选项），恰好
# “能用”但属于隐式副作用；gateway_prj_qemu.conf 覆盖 CONFIG_NET_SHELL=n 后
# 该间接选中链路被打断，QEMU 目标上 %.2f/%.1f 实际不生效。这里显式启用，
# 两个目标（gateway_prj.conf 为基础配置，QEMU 叠加其上且未反选此项）均覆盖，
# 不再依赖 NET_SHELL 的隐式连带效果。
# =============================================================================
CONFIG_PICOLIBC_IO_FLOAT=y

# =============================================================================
# 工业网关模块使能
# =============================================================================
CONFIG_GATEWAY_CAN_ENABLE=n
CONFIG_GATEWAY_MODBUS_ENABLE=y
CONFIG_GATEWAY_MQTT_ENABLE=y
CONFIG_GATEWAY_ANOMALY_ENABLE=y
CONFIG_GATEWAY_CLOUD_UPLOAD_ENABLE=y
CONFIG_GATEWAY_OFFLINE_CACHE_ENABLE=y
CONFIG_GATEWAY_DATA_SIMULATOR_ENABLE=y
CONFIG_GATEWAY_WEBSHELL_ENABLE=y
