# ESP32-C6-DevKitM-1（HP Core）专用 Kconfig 片段：原生 Wi-Fi 6 连接
#
# 说明：仓库根 CMakeLists.txt 固定了 CONF_FILE="framework/prj.conf;gateway_prj.conf"
# （见根 CMakeLists.txt 顶部），Zephyr 不会像 boards/*.overlay 那样自动合并本文件，
# 须显式通过 EXTRA_CONF_FILE 叠加：
#
#   west build -b esp32c6_devkitm -d build_esp32c6 . \
#     -- -DEXTRA_CONF_FILE=boards/esp32c6_devkitm_esp32c6_hpcore.conf
#
# 或使用 scripts/build.ps1：
#   .\scripts\build.ps1 -Board esp32c6_devkitm -BuildDir build_esp32c6 `
#     -WestExtra @("--","-DEXTRA_CONF_FILE=boards/esp32c6_devkitm_esp32c6_hpcore.conf")
#
# 与 boards/esp32c6_devkitm_esp32c6_hpcore.overlay（TWAI/UART1 引脚复用）配套，
# 该 overlay 已由 Zephyr 按 BOARD 名自动发现，无需额外参数。
#
# 纯 Wi-Fi：不在此开启 BLE / 802.15.4 网络协议栈（DTS 中 esp32_bt_hci /
# ieee802154 节点仍为 okay，但未使能对应 Kconfig 子系统，不产生额外 footprint）。
# 本文件不修改任何 devicetree。

# =============================================================================
# Wi-Fi 驱动与 net_mgmt 事件基础设施
# =============================================================================
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# CONFIG_NET_MGMT_EVENT_INFO 由 CONFIG_CONNECTIVITY_BACKEND_WIFI Kconfig select 自动打开

# =============================================================================
# connectivity / provisioning 模块 + Wi-Fi 后端
# =============================================================================
# EVENT_MAX_TYPES 默认 256（framework/Kconfig），未被本项目默认链覆盖，
# 已满足 connectivity(>60) / provisioning(>61) 依赖，无需在此覆盖。
#
# connectivity 后端自 Phase 5 起改为独立 bool（不再是互斥 choice），CONNECTIVITY_BACKEND_NULL
# 默认 y；ESP32-C6-DevKitM 无以太网/蜂窝 modem，故需显式关闭 null、只开 Wi-Fi 后端，
# 使 connect_auto()/failover 在单后端场景下等价于原单后端行为（无害的健康轮询）。
CONFIG_CONNECTIVITY_MODULE=y
CONFIG_CONNECTIVITY_BACKEND_NULL=n
CONFIG_CONNECTIVITY_BACKEND_WIFI=y
CONFIG_CONNECTIVITY_SHELL=y
CONFIG_PROVISIONING_MODULE=y
CONFIG_PROVISIONING_SHELL=y

# =============================================================================
# Wi-Fi 凭据持久化（app_kv → Settings/NVS）
# =============================================================================
# CONFIG_FLASH / CONFIG_FLASH_MAP / CONFIG_NVS 已在 gateway_prj.conf 中开启；
# SETTINGS_NVS 为 choice 项，须在此显式打开。ESP32-C6 默认分区表
# （espressif/partitions_0x0_default_4M.dtsi）已含 label="storage" 的
# storage_partition 节点，settings_nvs 后端在无 zephyr,settings-partition
# chosen 节点时会回退匹配该节点标签，故无需改动 DTS/overlay。
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_APP_KV_PERSIST=y

# =============================================================================
# 堆内存：net_mgmt/wifi_mgmt 事件回调、socket 缓冲等短生命周期分配
# =============================================================================
# 98304 (96KB) 为初始经验值，未在真实硬件上做过峰值实测；如出现 -ENOMEM
# 或 k_malloc 失败，请结合 `app memory` shell 命令观察实际峰值后调整。
CONFIG_HEAP_MEM_POOL_SIZE=98304
